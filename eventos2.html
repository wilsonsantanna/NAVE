<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAVE - Natureza, Violência, Ecocrítica</title>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    /* Estilos exclusivos para a galeria de miniaturas de eventos */
    .galeria-eventos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .evento-thumb {
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      aspect-ratio: 1 / 1; /* Deixa a miniatura quadrada. Mude para 3/4 se os pôsteres forem mais altos */
      background-color: #f0f0f0;
    }

    .evento-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* Garante que a imagem preencha o quadrado sem distorcer */
      transition: transform 0.3s ease;
    }

    /* Efeito de zoom na imagem ao passar o mouse */
    .evento-thumb:hover img {
      transform: scale(1.08);
    }

    /* Faixa escura com o título que sobe ao passar o mouse */
    .evento-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      color: #fff;
      padding: 30px 15px 15px;
      text-align: center;
      transform: translateY(100%);
      transition: transform 0.3s ease;
    }

    .evento-thumb:hover .evento-overlay {
      transform: translateY(0);
    }

    .evento-overlay h3 {
      margin: 0;
      font-size: 1.1rem;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>
  <header>
    <nav class="menu">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-list">
        <span aria-hidden="true">☰</span>
        <span class="sr-only">Menu</span>
      </button>
      <ul id="menu-list">
        <li><a href="./index.html">Início</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./eventos.html" class="current">Eventos</a></li>
        <li><a href="./acervo.html">Acervo</a></li>
        <li><a href="./publicacao.html">Publicação</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
  </header>

  <h1 class="conteudo">Eventos</h1>

  <main id="conteudo-principal">
    <!-- Container da Galeria -->
    <section id="eventos-lista" class="galeria-eventos">
      <p style="grid-column: 1 / -1; text-align: center;">Carregando eventos...</p>
    </section>

    <!-- Mantive os IDs exatos do seu Modal para não quebrar o CSS original -->
    <section id="detalhes-livro" class="modal hidden">
      <div class="modal-content">
        <button id="fechar-modal">Fechar</button>
        <h2 id="titulo-detalhe"></h2>
        <img id="imagem-detalhe" src="" alt="" style="max-width: 100%; height: auto; margin-bottom: 15px;">
        <p id="descricao-detalhe"></p>
        <p id="referencia-detalhe" style="font-weight: bold; margin-top: 15px; color: #444;"></p>
      </div>
    </section>

  </main>

  <footer id="contato">
    <p><strong>Ecobiblioteca NAVE</strong> — Faculdade de Letras da UFMG</p>
    <p>Av. Pres. Antônio Carlos, 6627, sala 2025, Pampulha, Belo Horizonte</p>
    <p>Segunda à sexta, das 9h às 13h e das 14h às 18h</p>
  </footer>

  <script src="script.js"></script>
  <!-- Script para ler a planilha e injetar os dados -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script>
    // IMPORTANTE: Troque o link abaixo pelo link CSV da sua NOVA planilha de EVENTOS
    const csvUrlEventos = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRuh-1V_PHMaccdY5vHKvHtUHIh_N29kQdRQdneEh_WfriJj8JKH7tpKqW_5UQ1u88Izl5Mmm9tvlfz/pub?output=csv';
    
    let dadosEventos = [];

    // 1. Carrega a planilha de eventos
    function iniciar() {
      Papa.parse(csvUrlEventos, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          dadosEventos = results.data;
          renderizarGaleria(dadosEventos);
        },
        error: function(err) {
          document.getElementById('eventos-lista').innerHTML = '<p>Erro ao carregar a planilha de eventos.</p>';
        }
      });
    }

    // 2. Renderiza as miniaturas na tela
    function renderizarGaleria(itens) {
      const lista = document.getElementById('eventos-lista');
      lista.innerHTML = ''; 

      if (itens.length === 0) {
        lista.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Nenhum evento encontrado.</p>';
        return;
      }

      itens.forEach((item) => {
        const titulo = item.titulo || 'Evento sem título';
        const imagem = item.imagem || 'https://via.placeholder.com/400x400?text=Sem+Imagem'; // Imagem padrão se a célula estiver vazia

        // Cria a miniatura (Thumbnail)
        const thumb = document.createElement('div');
        thumb.className = 'evento-thumb';
        
        // Estrutura: Imagem + Faixa sobreposta com o título
        thumb.innerHTML = `
          <img src="${imagem}" alt="${titulo}">
          <div class="evento-overlay">
            <h3>${titulo}</h3>
          </div>
        `;

        // Clique para abrir o modal
        thumb.addEventListener('click', () => abrirModalEvento(item));
        lista.appendChild(thumb);
      });
    }

    // 3. Lógica do Modal
    function abrirModalEvento(item) {
      const titulo = item.titulo || '';
      const imagem = item.imagem || '';
      const descricao = item.descricao || '';
      const detalhes = item.detalhes || ''; // Pode ser data/local na planilha

      document.getElementById('titulo-detalhe').textContent = titulo;
      document.getElementById('descricao-detalhe').textContent = descricao;
      document.getElementById('referencia-detalhe').textContent = detalhes;

      const imgElement = document.getElementById('imagem-detalhe');
      if (imagem) {
        imgElement.src = imagem;
        imgElement.style.display = ''; 
      } else {
        imgElement.src = '';
        imgElement.style.display = 'none'; 
      }

      document.getElementById('detalhes-livro').classList.remove('hidden');
    }

    // Fechar o modal
    document.getElementById('fechar-modal').addEventListener('click', function() {
      document.getElementById('detalhes-livro').classList.add('hidden');
    });

    document.getElementById('detalhes-livro').addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.add('hidden');
      }
    });

    // Roda a aplicação
    iniciar();
  </script>
</body>
</html>
