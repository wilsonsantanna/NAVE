<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAVE - Natureza, Violência, Ecocrítica</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <nav class="menu">
      <ul>
        <li><a href="./index.html">Início</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./eventos.html">Eventos</a></li>
        <li><a href="./acervo.html" class="current">Acervo</a></li>
        <li><a href="./publicacao.html">Publicação</a></li>
        <li><a href="#">Contato</a></li>
      </ul>
    </nav>
    <h1>Acervo</h1>
    <input type="text" id="busca" placeholder="Pesquisar livros...">
  </header>

  <main>
    <section id="acervo-lista" class="grid-container">
      <p style="grid-column: 1 / -1; text-align: center;">Carregando acervo...</p>
    </section>

    <section id="detalhes-livro" class="modal hidden">
      <div class="modal-content">
        <button id="fechar-modal">Fechar</button>
        <h2 id="titulo-detalhe"></h2>
        <img id="imagem-detalhe" src="" alt="">
        <p id="descricao-detalhe"></p>
        <p id="referencia-detalhe"></p>
      </div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  
  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRiLroU-1MbOLquTMnp1V7c0zWdCoE605Au1VM3kbi38taBOcdixb4n2PtW_Cbcq6P8PwvK022lhJOv/pub?gid=0&single=true&output=csv';
    let dadosAcervo = [];

    // 1. Inicia o carregamento da planilha
    function iniciar() {
      Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          dadosAcervo = results.data;
          renderizarLista(dadosAcervo);
        },
        error: function(err) {
          document.getElementById('acervo-lista').innerHTML = '<p>Erro ao carregar a planilha.</p>';
        }
      });
    }

    // 2. Renderiza os cartões na tela de forma segura
    function renderizarLista(itens) {
      const lista = document.getElementById('acervo-lista');
      lista.innerHTML = ''; 

      if (itens.length === 0) {
        lista.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Nenhum livro encontrado.</p>';
        return;
      }

      itens.forEach((item) => {
        // Cobre todas as variações possíveis de nomes de coluna
        const colunas = Object.keys(item);
        const titulo = item.titulo || item.Titulo || item.TÍTULO || item[colunas[0]] || 'Sem título';
        const referencia = item.referencia || item.Referencia || item.Referência || '';
        const imagemLocal = item.imagem || item.Imagem || item.Capa || '';
        const isbn = item.isbn || item.Isbn || item.ISBN || '';

        // Cria o cartão principal
        const card = document.createElement('div');
        card.className = 'livro-card'; 

        // Cria a tag da imagem
        const img = document.createElement('img');
        img.alt = `Capa de ${titulo}`;
        img.style.width = '100%';
        img.style.maxHeight = '200px';
        img.style.objectFit = 'cover';
        img.style.marginBottom = '10px';

        // Lógica de fallback: Qual imagem carregar primeiro?
        if (imagemLocal) {
            img.src = imagemLocal;
        } else if (isbn) {
            img.src = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
        } else {
            img.style.display = 'none'; // Não tem nenhuma das duas, oculta.
        }

        // Lógica de fallback: Se a imagem quebrar ao tentar carregar
        img.onerror = function() {
            // Se falhou e NÃO é um link da Open Library ainda, tentamos a Open Library
            if (!this.src.includes('covers.openlibrary.org') && isbn) {
                this.src = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
            } else {
                // Se falhou e JÁ ERA a Open Library (ou se não tem ISBN), esconde a tag
                this.style.display = 'none';
            }
        };

        // Cria a parte dos textos
        const divTextos = document.createElement('div');
        divTextos.innerHTML = `<h3>${titulo}</h3><p>${referencia}</p>`;

        // Monta o cartão e adiciona o evento de clique
        card.appendChild(img);
        card.appendChild(divTextos);
        card.addEventListener('click', () => abrirModal(item));
        
        // Joga na tela
        lista.appendChild(card);
      });
    }

    // 3. Sistema de Busca / Filtro
    document.getElementById('busca').addEventListener('input', function(e) {
      const termoBusca = e.target.value.toLowerCase();
      const itensFiltrados = dadosAcervo.filter(item => {
        const valoresDaLinha = Object.values(item).join(' ').toLowerCase();
        return valoresDaLinha.includes(termoBusca);
      });
      renderizarLista(itensFiltrados);
    });

    // 4. Lógica do Modal com Fallback
    function abrirModal(item) {
      const colunas = Object.keys(item);
      const titulo = item.titulo || item.Titulo || item.TÍTULO || item[colunas[0]] || 'Sem título';
      const referencia = item.referencia || item.Referencia || item.Referência || '';
      const descricao = item.descricao || item.Descricao || item.Resumo || '';
      const imagemLocal = item.imagem || item.Imagem || item.Capa || '';
      const isbn = item.isbn || item.Isbn || item.ISBN || '';

      document.getElementById('titulo-detalhe').textContent = titulo;
      document.getElementById('descricao-detalhe').textContent = descricao;
      document.getElementById('referencia-detalhe').textContent = referencia;

      const imgElement = document.getElementById('imagem-detalhe');
      imgElement.style.display = ''; // Garante que não ficou invisível do último clique

      // Mesma lógica de fallback da lista principal
      if (imagemLocal) {
        imgElement.src = imagemLocal;
      } else if (isbn) {
        imgElement.src = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
      } else {
        imgElement.src = '';
        imgElement.style.display = 'none';
      }

      imgElement.onerror = function() {
        if (!this.src.includes('covers.openlibrary.org') && isbn) {
            this.src = `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg?default=false`;
        } else {
            this.style.display = 'none';
        }
      };

      document.getElementById('detalhes-livro').classList.remove('hidden');
    }

    // Fechar Modal
    document.getElementById('fechar-modal').addEventListener('click', function() {
      document.getElementById('detalhes-livro').classList.add('hidden');
    });

    document.getElementById('detalhes-livro').addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.add('hidden');
      }
    });

    // Dispara a leitura
    iniciar();
  </script>
</body>
</html>
