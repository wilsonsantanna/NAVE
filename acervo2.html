<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NAVE - Natureza, Violência, Ecocrítica</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="skip-link" href="#conteudo-principal">Pular para o conteúdo</a>
  <header>
    <nav class="menu">
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="menu-list">
        <span aria-hidden="true">☰</span>
        <span class="sr-only">Menu</span>
      </button>
      <ul id="menu-list">
        <li><a href="./index.html">Início</a></li>
        <li><a href="./sobre.html">Sobre</a></li>
        <li><a href="./eventos.html">Eventos</a></li>
        <li><a href="./acervo.html" class="current">Acervo</a></li>
        <li><a href="./publicacao.html">Publicação</a></li>
        <li><a href="#contato">Contato</a></li>
      </ul>
    </nav>
    <h1>Acervo</h1>
    <input type="text" id="busca" placeholder="Pesquisar livros...">
  </header>

  <main id="conteudo-principal">
    <section id="acervo-lista" class="grid-container">
      <!-- Livros serão inseridos aqui dinamicamente -->
      <p style="grid-column: 1 / -1; text-align: center;">Carregando acervo...</p>
    </section>

    <!-- Modal 100% Original -->
    <section id="detalhes-livro" class="modal hidden">
      <div class="modal-content">
        <button id="fechar-modal">Fechar</button>
        <h2 id="titulo-detalhe"></h2>
        <img id="imagem-detalhe" src="" alt="">
        <p id="descricao-detalhe"></p>
        <p id="referencia-detalhe"></p>
      </div>
    </section>

  </main>

  <footer id="contato">
    <p><strong>Ecobiblioteca NAVE</strong> — Faculdade de Letras da UFMG</p>
    <p>Av. Pres. Antônio Carlos, 6627, sala 2025, Pampulha, Belo Horizonte</p>
    <p>Segunda à sexta, das 9h às 13h e das 14h às 18h</p>
  </footer>

  <script src="script.js"></script>
  <!-- Script para ler a planilha e injetar os dados -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script>
    const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRiLroU-1MbOLquTMnp1V7c0zWdCoE605Au1VM3kbi38taBOcdixb4n2PtW_Cbcq6P8PwvK022lhJOv/pub?gid=0&single=true&output=csv';
    
    let dadosAcervo = [];

    // 1. Carrega a planilha
    function iniciar() {
      Papa.parse(csvUrl, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          dadosAcervo = results.data;
          renderizarLista(dadosAcervo);
        },
        error: function(err) {
          document.getElementById('acervo-lista').innerHTML = '<p>Erro ao carregar a planilha.</p>';
        }
      });
    }

    // 2. Renderiza os cartões na lista principal
    function renderizarLista(itens) {
      const lista = document.getElementById('acervo-lista');
      lista.innerHTML = ''; 

      if (itens.length === 0) {
        lista.innerHTML = '<p style="grid-column: 1 / -1; text-align: center;">Nenhum livro encontrado.</p>';
        return;
      }

      itens.forEach((item) => {
        // Pega os dados exatos das colunas da planilha
        const titulo = item.titulo || 'Sem título';
        const referencia = item.referencia || '';
        const imagem = item.imagem || '';

        // Monta o cartão do livro (adapte as tags se o seu style.css pedir uma estrutura diferente aqui)
        const card = document.createElement('div');
        card.className = 'livro-card'; // Importante: garanta que esta classe existe no seu style.css
        
        // Se houver imagem, mostra a capinha na lista; se não, mostra só o texto
        let conteudoCard = '';
        if (imagem) {
            conteudoCard += `<img src="${imagem}" alt="Capa" style="width:100%; max-height:200px; object-fit:cover; margin-bottom:10px;">`;
        }
        conteudoCard += `<h3>${titulo}</h3><p>${referencia}</p>`;
        
        card.innerHTML = conteudoCard;

        // Adiciona o evento de clique para abrir o modal original
        card.addEventListener('click', () => abrirModal(item));
        lista.appendChild(card);
      });
    }

    // 3. Sistema de Busca
    document.getElementById('busca').addEventListener('input', function(e) {
      const termoBusca = e.target.value.toLowerCase();
      const itensFiltrados = dadosAcervo.filter(item => {
        const valoresDaLinha = Object.values(item).join(' ').toLowerCase();
        return valoresDaLinha.includes(termoBusca);
      });
      renderizarLista(itensFiltrados);
    });

    // 4. Lógica do Modal com os PARÂMETROS ANTIGOS
    function abrirModal(item) {
      // Puxa exatamente as 4 colunas que você vai criar no Google Sheets
      const titulo = item.titulo || '';
      const imagem = item.imagem || '';
      const descricao = item.descricao || '';
      const referencia = item.referencia || '';

      // Injeta direto nas tags do seu HTML sem modificar a estrutura
      document.getElementById('titulo-detalhe').textContent = titulo;
      document.getElementById('descricao-detalhe').textContent = descricao;
      document.getElementById('referencia-detalhe').textContent = referencia;

      const imgElement = document.getElementById('imagem-detalhe');
      if (imagem) {
        imgElement.src = imagem;
        imgElement.style.display = ''; // Deixa o seu CSS definir o tamanho
      } else {
        imgElement.src = '';
        imgElement.style.display = 'none'; // Esconde a tag para não ficar com ícone quebrado
      }

      // Exibe o modal
      document.getElementById('detalhes-livro').classList.remove('hidden');
    }

    // Fechar o modal no botão
    document.getElementById('fechar-modal').addEventListener('click', function() {
      document.getElementById('detalhes-livro').classList.add('hidden');
    });

    // Fechar o modal clicando fora dele
    document.getElementById('detalhes-livro').addEventListener('click', function(e) {
      if (e.target === this) {
        this.classList.add('hidden');
      }
    });

    // Roda a aplicação
    iniciar();
  </script>
</body>
</html>
